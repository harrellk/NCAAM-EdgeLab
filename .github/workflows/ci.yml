name: EdgeLab CI / Lint + Format + Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests black ruff

      - name: Lint + Format
        run: |
          ruff check .
          ruff format --check .
          black --check .

      - name: EdgeLab Sanity Check
        run: |
          python src/run_daily.py || (echo "Model sanity check failed" && exit 1)
